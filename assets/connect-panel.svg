<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 180" role="img" aria-labelledby="t d"><title id="t">Let’s connect</title><desc id="d">Compact dark contact card with LinkedIn, Email, and GitHub buttons.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#0a1731"/><stop offset="1" stop-color="#180d2c"/></linearGradient></defs><rect width="1400" height="180" rx="22" fill="url(#g)" stroke="#293c63"/><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="53" fill="#f4f7ff" font-size="25" font-weight="700">✈  Let’s Connect</text><text x="42" y="91" fill="#c9d5eb" font-size="16">Interested in opportunities involving LLM systems, RAG, AI agents, multimodal applications,</text><text x="42" y="117" fill="#c9d5eb" font-size="16">evaluation, and production AI infrastructure.</text><rect x="1000" y="42" width="115" height="42" rx="10" fill="#102544" stroke="#2bd7ff"/><text x="1022" y="68" fill="#9ceeff" font-size="15">in  LinkedIn</text><rect x="1130" y="42" width="106" height="42" rx="10" fill="#281634" stroke="#ed69cf"/><text x="1154" y="68" fill="#f3adf0" font-size="15">✉  Email</text><rect x="1251" y="42" width="106" height="42" rx="10" fill="#14203d" stroke="#7e9dcc"/><text x="1272" y="68" fill="#cfdbf5" font-size="15">◉  GitHub</text></g></svg>