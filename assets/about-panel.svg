<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 390" role="img" aria-labelledby="t d"><title id="t">About Bashar Al-Muntaser and professional snapshot</title><desc id="d">Two-column dark portfolio card with About Me and professional snapshot.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#071021"/><stop offset="1" stop-color="#0d1730"/></linearGradient></defs><rect x="0" y="0" width="1400" height="390" rx="22" fill="#060c1a" stroke="#243454"/><rect x="0" y="0" width="910" height="390" rx="22" fill="url(#bg)" stroke="#243454"/><rect x="910" y="0" width="490" height="390" rx="22" fill="#091226" stroke="#243454"/><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="50" fill="#f4f7ff" font-size="25" font-weight="700">●  About Me</text><text x="42" y="91" fill="#d1dcf3" font-size="17">I’m an LLM Engineer focused on designing reliable generative-AI systems,</text><text x="42" y="119" fill="#d1dcf3" font-size="17">multi-model orchestration, retrieval-augmented generation, agentic systems,</text><text x="42" y="147" fill="#d1dcf3" font-size="17">evaluation, observability, and production deployment. I enjoy building AI</text><text x="42" y="175" fill="#d1dcf3" font-size="17">systems that solve real problems, with interests in Arabic NLP, multimodal AI,</text><text x="42" y="203" fill="#d1dcf3" font-size="17">structured generation, AI infrastructure, and production reliability.</text><g font-size="15"><circle cx="68" cy="274" r="22" fill="#13234a" stroke="#ffd35c"/><text x="58" y="281" fill="#ffd35c" font-size="20">✦</text><text x="102" y="270" fill="#f6f8ff" font-weight="700">Problem Solver</text><text x="102" y="291" fill="#aab9d7">Turns problems into useful systems</text><circle cx="320" cy="274" r="22" fill="#13234a" stroke="#65a7ff"/><text x="311" y="281" fill="#65a7ff" font-size="20">↗</text><text x="354" y="270" fill="#f6f8ff" font-weight="700">Build &amp; Ship</text><text x="354" y="291" fill="#aab9d7">From experiment to integration</text><circle cx="590" cy="274" r="22" fill="#13234a" stroke="#43e2c2"/><text x="580" y="281" fill="#43e2c2" font-size="20">♢</text><text x="624" y="270" fill="#f6f8ff" font-weight="700">Open to Opportunities</text><text x="624" y="291" fill="#aab9d7">LLM, RAG, agents, multimodal AI</text><circle cx="82" cy="340" r="22" fill="#13234a" stroke="#a98bff"/><text x="72" y="347" fill="#a98bff" font-size="20">▤</text><text x="116" y="336" fill="#f6f8ff" font-weight="700">Continuous Learner</text><text x="116" y="357" fill="#aab9d7">Evaluation and reliable AI</text><circle cx="390" cy="340" r="22" fill="#13234a" stroke="#ed63c9"/><text x="380" y="347" fill="#ed63c9" font-size="20">◎</text><text x="424" y="336" fill="#f6f8ff" font-weight="700">Focus on Real Impact</text><text x="424" y="357" fill="#aab9d7">Practical systems over hype</text></g><text x="952" y="50" fill="#f4f7ff" font-size="25" font-weight="700">◈  Snapshot</text><circle cx="985" cy="113" r="28" fill="#102b61" stroke="#6da9ff"/><text x="973" y="122" fill="#9ed0ff" font-size="22">◆</text><text x="1035" y="108" fill="#f6f8ff" font-size="17" font-weight="700">B.Sc. Artificial Intelligence</text><text x="1035" y="134" fill="#b9c7e2" font-size="16">Emirates International University</text><text x="1035" y="160" fill="#b9c7e2" font-size="15">2022 – 2026</text><path d="M985 165v38" stroke="#2d4168"/><circle cx="985" cy="252" r="28" fill="#3a2911" stroke="#ffc15a"/><text x="974" y="261" fill="#ffd486" font-size="22">▣</text><text x="1035" y="247" fill="#f6f8ff" font-size="17" font-weight="700">AI Engineer Intern — Sofa</text><text x="1035" y="273" fill="#b9c7e2" font-size="15">Aug 2026 – Present</text><text x="1035" y="299" fill="#b9c7e2" font-size="15">Multi-model routing · evaluation</text><text x="1035" y="322" fill="#b9c7e2" font-size="15">AI security · memory architectures</text><text x="1035" y="345" fill="#b9c7e2" font-size="15">production integration</text></g></svg>