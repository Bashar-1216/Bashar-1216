<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="1000" height="140" role="img" aria-labelledby="title desc">
  <title id="title">Personal traits</title>
  <desc id="desc">Problem Solver, Build and Ship, Open to Opportunities, Continuous Learner, and Real Impact.</desc>
  <style>
    .title { fill: #24292f; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .detail { fill: #57606a; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f0f6fc; }
      .detail { fill: #8b949e; }
    }
  </style>

  <!-- Problem Solver / lightbulb -->
  <g transform="translate(100 0)">
    <path d="M-9 23c0-8 6-14 14-14s14 6 14 14c0 5-3 9-7 12-2 2-3 4-3 7H1c0-3-1-5-3-7-4-3-7-7-7-12Z" fill="none" stroke="#e6ad24" stroke-width="3" stroke-linejoin="round"/>
    <path d="M1 57h8M2 63h6M5 70h2M5 35l4-6M5 35l-4-6" fill="none" stroke="#e6ad24" stroke-width="3" stroke-linecap="round"/>
    <text class="title" text-anchor="middle" x="0" y="91">Problem Solver</text>
    <text class="detail" text-anchor="middle" x="0" y="109">Turns problems into useful systems</text>
  </g>

  <!-- Build & Ship / rocket -->
  <g transform="translate(300 0)">
    <path d="M-2 40c0-13 7-25 19-32 2 12-1 24-10 33Z" fill="none" stroke="#7c83ff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-2 40-14 43l7-12M-2 40l-3 12 10-7M7 34l-9 9" fill="none" stroke="#7c83ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="10" cy="19" r="3" fill="none" stroke="#7c83ff" stroke-width="2"/>
    <path d="M-7 51c-5 4-6 8-6 12 5-1 9-3 12-8" fill="none" stroke="#7c83ff" stroke-width="3" stroke-linecap="round"/>
    <text class="title" text-anchor="middle" x="0" y="91">Build &amp; Ship</text>
    <text class="detail" text-anchor="middle" x="0" y="109">From experiment to integration</text>
  </g>

  <!-- Open to Opportunities / handshake -->
  <g transform="translate(500 0)">
    <path d="M-25 28h9l8 7 8-7h9l7 8-10 10-9-5-7 6-15-12Z" fill="none" stroke="#27c9b5" stroke-width="3" stroke-linejoin="round"/>
    <path d="m-15 36 9 8m8-2 6 5m-19-1 5 5m13-2 4 3" fill="none" stroke="#27c9b5" stroke-width="3" stroke-linecap="round"/>
    <text class="title" text-anchor="middle" x="0" y="91">Open to Opportunities</text>
    <text class="detail" text-anchor="middle" x="0" y="109">LLMs, RAG, agents, multimodal AI</text>
  </g>

  <!-- Continuous Learner / open book -->
  <g transform="translate(700 0)">
    <path d="M-27 20c8-4 17-3 27 3v27c-10-6-19-7-27-3Z" fill="none" stroke="#32a8ff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M27 20c-8-4-17-3-27 3v27c10-6 19-7 27-3Z" fill="none" stroke="#32a8ff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0 23v27M-19 27h8M19 27h-8" fill="none" stroke="#32a8ff" stroke-width="2" stroke-linecap="round"/>
    <text class="title" text-anchor="middle" x="0" y="91">Continuous Learner</text>
    <text class="detail" text-anchor="middle" x="0" y="109">Evaluation and reliable AI</text>
  </g>

  <!-- Real Impact / target -->
  <g transform="translate(900 0)">
    <circle cx="0" cy="35" r="22" fill="none" stroke="#ed62c9" stroke-width="3"/>
    <circle cx="0" cy="35" r="12" fill="none" stroke="#ed62c9" stroke-width="3"/>
    <circle cx="0" cy="35" r="3" fill="#ed62c9"/>
    <path d="M17 18 26 9M21 9h5v5" fill="none" stroke="#ed62c9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="title" text-anchor="middle" x="0" y="91">Real Impact</text>
    <text class="detail" text-anchor="middle" x="0" y="109">Practical systems over hype</text>
  </g>
</svg>
